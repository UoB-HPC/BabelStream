name: Linux

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cpp:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        # prettier-ignore
        include:
          ### CPU, built and run ###
          - {variant: "gcc-9-serial", model: "serial", toolchain: &gcc_9 {image: "docker.io/library/ubuntu:22.04", cc: "gcc-9", cxx: "g++-9", packages: "g++-9"}}
          - {variant: "gcc-9-omp", model: "omp", toolchain: *gcc_9}
          - {variant: "gcc-10-serial", model: "serial", toolchain: &gcc_10 {image: "docker.io/library/ubuntu:22.04", cc: "gcc-10", cxx: "g++-10", packages: "g++-10"}}
          - {variant: "gcc-10-omp", model: "omp", toolchain: *gcc_10}
          - {variant: "gcc-11-serial", model: "serial", toolchain: &gcc_11 {image: "docker.io/library/ubuntu:22.04", cc: "gcc-11", cxx: "g++-11", packages: "g++-11"}}
          - {variant: "gcc-11-omp", model: "omp", toolchain: *gcc_11}
          - {variant: "gcc-12-serial", model: "serial", toolchain: &gcc_12 {image: "docker.io/library/ubuntu:22.04", cc: "gcc-12", cxx: "g++-12", packages: "g++-12"}}
          - {variant: "gcc-12-omp", model: "omp", toolchain: *gcc_12}
          - {variant: "gcc-13-serial", model: "serial", toolchain: &gcc_13 {image: "docker.io/library/ubuntu:24.04", cc: "gcc-13", cxx: "g++-13", packages: "g++-13"}}
          - {variant: "gcc-13-omp", model: "omp", toolchain: *gcc_13}
          - {variant: "gcc-14-serial", model: "serial", toolchain: &gcc_14 {image: "docker.io/library/ubuntu:24.04", cc: "gcc-14", cxx: "g++-14", packages: "g++-14"}}
          - {variant: "gcc-14-omp", model: "omp", toolchain: *gcc_14}
          - {variant: "gcc-15-serial", model: "serial", toolchain: &gcc_15 {image: "docker.io/library/ubuntu:24.04", cc: "gcc-15", cxx: "g++-15", packages: "g++-15", apt_key: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xC8EC952E2A0E1FBDC5090F6A2C277A0A352154E5",
              apt_source: "https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu noble main"}}
          - {variant: "gcc-15-omp", model: "omp", toolchain: *gcc_15}
          - {variant: "clang-11-serial", model: "serial", toolchain: &clang_11 {image: "docker.io/library/ubuntu:22.04", cc: "clang-11", cxx: "clang++-11", packages: "clang-11"}}
          - {variant: "clang-11-omp", model: "omp", cmake_args: &clang_omp_flags "-DCXX_EXTRA_FLAGS=-Wno-pass-failed", model_packages: "libomp-11-dev", toolchain: *clang_11}
          - {variant: "clang-12-serial", model: "serial", toolchain: &clang_12 {image: "docker.io/library/ubuntu:22.04", cc: "clang-12", cxx: "clang++-12", packages: "clang-12"}}
          - {variant: "clang-12-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-12-dev", toolchain: *clang_12}
          - {variant: "clang-13-serial", model: "serial", toolchain: &clang_13 {image: "docker.io/library/ubuntu:22.04", cc: "clang-13", cxx: "clang++-13", packages: "clang-13"}}
          - {variant: "clang-13-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-13-dev", toolchain: *clang_13}
          - {variant: "clang-14-serial", model: "serial", toolchain: &clang_14 {image: "docker.io/library/ubuntu:22.04", cc: "clang-14", cxx: "clang++-14", packages: "clang-14"}}
          - {variant: "clang-14-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-14-dev", toolchain: *clang_14}
          - {variant: "clang-15-serial", model: "serial", toolchain: &clang_15 {image: "docker.io/library/ubuntu:22.04", cc: "clang-15", cxx: "clang++-15", packages: "clang-15"}}
          - {variant: "clang-15-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-15-dev", toolchain: *clang_15}
          - {variant: "clang-16-serial", model: "serial", toolchain: &clang_16 {image: "docker.io/library/ubuntu:24.04", cc: "clang-16", cxx: "clang++-16", packages: "clang-16"}}
          - {variant: "clang-16-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-16-dev", toolchain: *clang_16}
          - {variant: "clang-17-serial", model: "serial", toolchain: &clang_17 {image: "docker.io/library/ubuntu:24.04", cc: "clang-17", cxx: "clang++-17", packages: "clang-17"}}
          - {variant: "clang-17-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-17-dev", toolchain: *clang_17}
          - {variant: "clang-18-serial", model: "serial", toolchain: &clang_18 {image: "docker.io/library/ubuntu:24.04", cc: "clang-18", cxx: "clang++-18", packages: "clang-18"}}
          - {variant: "clang-18-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-18-dev", toolchain: *clang_18}
          - {variant: "clang-19-serial", model: "serial", toolchain: &clang_19 {image: "docker.io/library/ubuntu:26.04", cc: "clang-19", cxx: "clang++-19", packages: "clang-19 libstdc++-16-dev"}}
          - {variant: "clang-19-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-19-dev", toolchain: *clang_19}
          - {variant: "clang-20-serial", model: "serial", toolchain: &clang_20 {image: "docker.io/library/ubuntu:26.04", cc: "clang-20", cxx: "clang++-20", packages: "clang-20 libstdc++-16-dev"}}
          - {variant: "clang-20-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-20-dev", toolchain: *clang_20}
          - {variant: "clang-21-serial", model: "serial", toolchain: &clang_21 {image: "docker.io/library/ubuntu:26.04", cc: "clang-21", cxx: "clang++-21", packages: "clang-21 libstdc++-16-dev"}}
          - {variant: "clang-21-omp", model: "omp", cmake_args: *clang_omp_flags, model_packages: "libomp-21-dev", toolchain: *clang_21}
          - {variant: "gcc-13-omp-target", model: "omp", cmake_args: "-DOFFLOAD=ON -DOFFLOAD_FLAGS=-fopenmp", toolchain: *gcc_13}
          - {variant: "gcc-13-std-data", model: "std-data", cmake_args: "-DUSE_TBB=ON", model_packages: "libtbb-dev", toolchain: *gcc_13}
          - {variant: "gcc-13-std-indices", model: "std-indices", cmake_args: "-DUSE_TBB=ON", model_packages: "libtbb-dev", toolchain: *gcc_13}
          - {variant: "gcc-13-std-data-onedpl", model: "std-data", cmake_args: "-DUSE_ONEDPL=OPENMP -DFETCH_ONEDPL=ON", model_packages: "git", toolchain: *gcc_13}
          - {variant: "gcc-13-std-ranges", model: "std-ranges", cmake_args: "-DUSE_TBB=ON", model_packages: "libtbb-dev", toolchain: *gcc_13}
          - {variant: "gcc-13-tbb", model: "tbb", model_packages: "libtbb-dev", toolchain: *gcc_13}
          - {variant: "gcc-13-tbb-fetch", model: "tbb", cmake_args: "-DFETCH_TBB=ON -DUSE_TBB=ON", model_packages: "git", toolchain: *gcc_13}
          - {variant: "gcc-13-kokkos", model: "kokkos", kokkos_ref: "4.7.04", cmake_args: "-DKOKKOS_IN_TREE=/opt/kokkos -DKokkos_ENABLE_SERIAL=ON", model_packages: "git", toolchain: *gcc_13}
          - {variant: "gcc-13-kokkos-5", model: "kokkos", kokkos_ref: "5.2.2", cmake_args: "-DKOKKOS_IN_TREE=/opt/kokkos -DKokkos_ENABLE_SERIAL=ON", model_packages: "git", toolchain: *gcc_13}
          - {variant: "gcc-13-raja", model: "raja", raja_ref: "v2026.07.1", cmake_args: "-DRAJA_IN_TREE=/opt/raja -DENABLE_OPENMP=ON", model_packages: "git", toolchain: *gcc_13}
          - {variant: "gcc-13-ocl", model: "ocl", model_packages: "pocl-opencl-icd ocl-icd-opencl-dev", toolchain: *gcc_13}
          - {variant: "oneapi-sycl2020-acc", model: "sycl2020-acc", cmake_args: "-DSYCL_COMPILER=ONEAPI-ICPX", model_packages: "pocl-opencl-icd", toolchain: &oneapi {architectures: [x86_64], image: "docker.io/library/ubuntu:24.04",
              cc: "/opt/intel/oneapi/compiler/2025.3/bin/icx", cxx: "/opt/intel/oneapi/compiler/2025.3/bin/icpx", packages: "intel-oneapi-dpcpp-cpp-2025.3",
              apt_key: "https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB", apt_source: "https://apt.repos.intel.com/oneapi
                all main", env_script: "/opt/intel/oneapi/setvars.sh"}}
          - {variant: "oneapi-sycl2020-usm", model: "sycl2020-usm", cmake_args: "-DSYCL_COMPILER=ONEAPI-ICPX", model_packages: "pocl-opencl-icd", toolchain: *oneapi}
          - {variant: "oneapi-std-data", model: "std-data", cmake_args: "-DUSE_ONEDPL=DPCPP -DFETCH_ONEDPL=ON", model_packages: "git pocl-opencl-icd", toolchain: *oneapi}
          - {variant: "oneapi-std-indices", model: "std-indices", cmake_args: "-DUSE_ONEDPL=DPCPP -DFETCH_ONEDPL=ON", model_packages: "git pocl-opencl-icd", toolchain: *oneapi}
          - {variant: "oneapi-std-ranges", model: "std-ranges", cmake_args: "-DUSE_ONEDPL=DPCPP -DFETCH_ONEDPL=ON", model_packages: "git pocl-opencl-icd", toolchain: *oneapi}
          - {variant: "nvhpc-serial", model: "serial", toolchain: &nvhpc {image: "nvcr.io/nvidia/nvhpc:26.5-devel-cuda13.2-ubuntu24.04", cc: "nvc", cxx: "nvc++", native_flags: "-tp=native", cleanup_disk: true}}
          - {variant: "nvhpc-omp", model: "omp", toolchain: *nvhpc}
          - {variant: "nvhpc-acc", model: "acc", cmake_args: "-DTARGET_DEVICE=multicore", toolchain: *nvhpc}
          - {variant: "nvhpc-std-data-multicore", model: "std-data", cmake_args: "-DNVHPC_MULTICORE=ON", toolchain: *nvhpc}
          - {variant: "adaptivecpp-sycl2020-acc", model: "sycl2020-acc", cmake_args: "-DSYCL_COMPILER=AdaptiveCpp -DSYCL_COMPILER_DIR=/opt/adaptivecpp", toolchain: &adaptivecpp {
              image: "docker.io/library/ubuntu:24.04", cc: "clang-18", cxx: "clang++-18", packages: "clang-18 llvm-18-dev libclang-18-dev libclang-cpp18-dev libomp-18-dev lld-18 python3",
              source_url: "https://github.com/AdaptiveCpp/AdaptiveCpp/archive/refs/tags/v25.10.0.tar.gz", sha256: "334b16ebff373bd2841f83332c2ae9a45ec192f2cf964d5fdfe94e1140776059"}}
          - {variant: "adaptivecpp-sycl2020-usm", model: "sycl2020-usm", cmake_args: "-DSYCL_COMPILER=AdaptiveCpp -DSYCL_COMPILER_DIR=/opt/adaptivecpp", toolchain: *adaptivecpp}
          - {variant: "adaptivecpp-std-data", model: "std-data", cmake_args: "-DCMAKE_CXX_COMPILER=/opt/adaptivecpp/bin/acpp -DACPP_OFFLOAD=ON", toolchain: *adaptivecpp}
          - {variant: "adaptivecpp-pcuda", model: "cuda", cmake_args: "-DACPP_PCUDA_DRIVER=ON -DCMAKE_CXX_COMPILER=/opt/adaptivecpp/bin/acpp -DCMAKE_CUDA_COMPILER=/opt/adaptivecpp/bin/acpp -DCUDA_ARCH=sm_80 -DCUDA_EXTRA_FLAGS=--acpp-targets=generic", toolchain: *adaptivecpp}
          - {variant: "futhark", model: "futhark", futhark_ref: "v0.28.1", futhark_sha256: "044a8ef2f55e3a8eb18d367dfa85438e958e61dedfd0f6621b507eb9d6fff281",
              cmake_args: "-DFUTHARK_COMPILER=/opt/futhark/bin/futhark -DFUTHARK_BACKEND=multicore", model_packages: "xz-utils", toolchain: {architectures: [x86_64], image: "docker.io/library/ubuntu:24.04",
              cc: "gcc", cxx: "g++"}}
          - {variant: "futhark-ubuntu", model: "futhark", cmake_args: "-DFUTHARK_COMPILER=/usr/bin/futhark -DFUTHARK_BACKEND=multicore", model_packages: "futhark", toolchain: {image: "docker.io/library/ubuntu:26.04", cc: "gcc", cxx: "g++"}}

          ### GPU, compile only ###
          - {variant: "gcc-15-omp-nvptx", model: "omp", skip_tests: true, cmake_args: "-DOFFLOAD=ON -DOFFLOAD_FLAGS=-fopenmp;-foffload=nvptx-none;-foffload-options=nvptx-none=-misa=sm_80 -DCXX_EXTRA_FLAGS=-fcf-protection=none", toolchain: &gcc_15_offload {architectures: [x86_64], image: "docker.io/library/ubuntu:26.04", cc: "gcc-15", cxx: "g++-15", packages: "g++-15 gcc-15-offload-nvptx gcc-15-offload-amdgcn"}}
          - {variant: "gcc-15-omp-amdgcn", model: "omp", skip_tests: true, cmake_args: "-DOFFLOAD=ON -DOFFLOAD_FLAGS=-fopenmp;-foffload=amdgcn-amdhsa;-foffload-options=amdgcn-amdhsa=-march=gfx90a -DCXX_EXTRA_FLAGS=-fcf-protection=none", toolchain: *gcc_15_offload}
          - {variant: "nvhpc-omp-gpu", model: "omp", skip_tests: true, cmake_args: "-DOFFLOAD=ON -DOFFLOAD_FLAGS=-mp=gpu;-gpu=cc80", toolchain: *nvhpc}
          - {variant: "nvhpc-acc-gpu", model: "acc", skip_tests: true, cmake_args: "-DTARGET_DEVICE=gpu -DCUDA_ARCH=cc80", toolchain: *nvhpc}
          - {variant: "nvhpc-std-data-gpu", model: "std-data", skip_tests: true, cmake_args: "-DNVHPC_OFFLOAD=cc80", toolchain: *nvhpc}
          - {variant: "nvhpc-std-indices-gpu", model: "std-indices", skip_tests: true, cmake_args: "-DNVHPC_OFFLOAD=cc80", toolchain: *nvhpc}
          - {variant: "nvhpc-std-ranges-gpu", model: "std-ranges", skip_tests: true, cmake_args: "-DNVHPC_OFFLOAD=cc80", toolchain: *nvhpc}
          - {variant: "cuda", model: "cuda", skip_tests: true, cmake_args: "-DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.2/bin/nvcc -DCUDA_ARCH=sm_80", toolchain: &cuda {image: "docker.io/library/ubuntu:24.04",
              cc: "gcc", cxx: "g++", packages: "cuda-nvcc-13-2", arm_apt_key: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/3bf863cc.pub",
              arm_apt_source: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/ /",
              apt_key: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/3bf863cc.pub", apt_source: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/
                /", env_script: ".github/ci/cuda-env.sh"}}
          # FIXME enable aarch64, clang 18's nvptx device pass trips on glibc's SVE types (fixed by clang >= 19, see cuda-clang-21)
          - {variant: "cuda-clang", model: "cuda", skip_tests: true, cmake_args: "-DCMAKE_CUDA_COMPILER=clang++-18 -DCUDA_CLANG_DRIVER=ON -DCUDA_ARCH=sm_80", toolchain: {architectures: [x86_64], image: "docker.io/library/ubuntu:24.04",
              cc: "clang-18", cxx: "clang++-18", packages: "clang-18 cuda-nvcc-12-6 cuda-cudart-dev-12-6 libcurand-dev-12-6", arm_apt_key: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/3bf863cc.pub",
              arm_apt_source: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/ /",
              apt_key: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/3bf863cc.pub", apt_source: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/
                /"}}
          - {variant: "cuda-clang-21", model: "cuda", skip_tests: true, cmake_args: "-DCMAKE_CUDA_COMPILER=clang++-21 -DCUDA_CLANG_DRIVER=ON -DCUDA_ARCH=sm_80", toolchain: {image: "docker.io/library/ubuntu:26.04",
              cc: "clang-21", cxx: "clang++-21", packages: "clang-21 clang-tools-21 libstdc++-16-dev cuda-nvcc-12-6 cuda-cudart-dev-12-6 libcurand-dev-12-6", arm_apt_key: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/3bf863cc.pub",
              arm_apt_source: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/sbsa/ /",
              apt_key: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/3bf863cc.pub", apt_source: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/
                /"}}
          - {variant: "cuda-tuned", model: "cuda-tuned", skip_tests: true, cmake_args: "-DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.2/bin/nvcc -DCUDA_ARCH=sm_80", model_packages: "cuda-nvml-dev-13-2", toolchain: *cuda}
          - {variant: "kokkos-cuda", model: "kokkos", skip_tests: true, kokkos_ref: "4.7.04", cmake_args: "-DCMAKE_CXX_COMPILER=/opt/kokkos/bin/nvcc_wrapper -DKOKKOS_IN_TREE=/opt/kokkos -DKokkos_ENABLE_CUDA=ON -DKokkos_ARCH_AMPERE80=ON -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON", model_packages: "git cuda-cudart-dev-13-2 cuda-driver-dev-13-2", toolchain: *cuda}
          - {variant: "kokkos-5-cuda", model: "kokkos", skip_tests: true, kokkos_ref: "5.2.2", cmake_args: "-DCMAKE_CXX_COMPILER=/opt/kokkos/bin/nvcc_wrapper -DKOKKOS_IN_TREE=/opt/kokkos -DKokkos_ENABLE_CUDA=ON -DKokkos_ARCH_AMPERE80=ON -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON", model_packages: "git cuda-cudart-dev-13-2 cuda-driver-dev-13-2", toolchain: *cuda}
          - {variant: "raja-cuda", model: "raja", skip_tests: true, raja_ref: "v2026.07.1", cmake_args: "-DRAJA_IN_TREE=/opt/raja -DENABLE_CUDA=ON -DTARGET=NVIDIA -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-13.2 -DCUDA_ARCH=sm_80 -DCMAKE_CUDA_ARCHITECTURES=80 -DENABLE_OPENMP=OFF", model_packages: "git cuda-cudart-dev-13-2 cuda-driver-dev-13-2", toolchain: *cuda}
          - {variant: "thrust", model: "thrust", skip_tests: true, cmake_args: "-DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.2/bin/nvcc -DCUDA_ARCH=80", toolchain: *cuda}
          - {variant: "thrust-fetch-cccl", model: "thrust", skip_tests: true, cmake_args: "-DCMAKE_CUDA_COMPILER=/usr/local/cuda-13.2/bin/nvcc -DCUDA_ARCH=80 -DFETCH_CCCL=ON", model_packages: "git", toolchain: *cuda}
          - {variant: "rocm-hip", model: "hip", skip_tests: true, cmake_args: "-DCXX_EXTRA_FLAGS=--offload-arch=gfx90a", toolchain: &rocm {architectures: [x86_64], image: "docker.io/library/ubuntu:24.04", cc: "gcc", cxx: "/opt/rocm/bin/hipcc",
              packages: "hip-dev rocm-device-libs", apt_key: "https://repo.radeon.com/rocm/rocm.gpg.key", apt_source: "https://repo.radeon.com/rocm/apt/7.2.4/ noble main"}}
          - {variant: "rocm-std-data", model: "std-data", skip_tests: true, cmake_args: "-DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ -DAMDGPU_TARGET_OFFLOAD=gfx90a", model_packages: "rocthrust-dev", toolchain: *rocm}
          - {variant: "rocm-std-indices", model: "std-indices", skip_tests: true, cmake_args: "-DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ -DAMDGPU_TARGET_OFFLOAD=gfx90a", model_packages: "rocthrust-dev", toolchain: *rocm}
          - {variant: "rocm-std-ranges", model: "std-ranges", skip_tests: true, cmake_args: "-DCMAKE_CXX_COMPILER=/opt/rocm/llvm/bin/clang++ -DAMDGPU_TARGET_OFFLOAD=gfx90a", model_packages: "rocthrust-dev", toolchain: *rocm}
    uses: ./.github/workflows/cpp.yml
    with:
      configuration: ${{ toJSON(matrix) }}

  fortran:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        # prettier-ignore
        include:
          ### CPU, built and run ###
          - {variant: "gfortran-15-sequential", compiler: "gcc", implementation: "Sequential", toolchain: &gfortran_15 {image: "docker.io/library/ubuntu:26.04", fc: "gfortran-15", packages: "gfortran-15"}}
          - {variant: "gfortran-15-array", compiler: "gcc", implementation: "Array", toolchain: *gfortran_15}
          - {variant: "gfortran-15-doconcurrent", compiler: "gcc", implementation: "DoConcurrent", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openmpworkshare", compiler: "gcc", implementation: "OpenMPWorkshare", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openmptaskloop", compiler: "gcc", implementation: "OpenMPTaskloop", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openmptarget", compiler: "gcc", implementation: "OpenMPTarget", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openmptargetloop", compiler: "gcc", implementation: "OpenMPTargetLoop", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openacc", compiler: "gcc", implementation: "OpenACC", toolchain: *gfortran_15}
          - {variant: "gfortran-15-openaccarray", compiler: "gcc", implementation: "OpenACCArray", toolchain: *gfortran_15}
          - {variant: "gfortran-14-array", compiler: "gcc", implementation: "Array", toolchain: &gfortran_14 {image: "docker.io/library/ubuntu:24.04", fc: "gfortran-14", packages: "gfortran-14"}}
          - {variant: "gfortran-14-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_14}
          - {variant: "gfortran-13-array", compiler: "gcc", implementation: "Array", toolchain: &gfortran_13 {image: "docker.io/library/ubuntu:24.04", fc: "gfortran-13", packages: "gfortran-13"}}
          - {variant: "gfortran-13-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_13}
          - {variant: "gfortran-12-array", compiler: "gcc", implementation: "Array", toolchain: &gfortran_12 {image: "docker.io/library/ubuntu:24.04", fc: "gfortran-12", packages: "gfortran-12"}}
          - {variant: "gfortran-12-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_12}
          - {variant: "gfortran-11-array", compiler: "gcc", implementation: "Array", toolchain: &gfortran_11 {image: "docker.io/library/ubuntu:24.04", fc: "gfortran-11", packages: "gfortran-11"}}
          - {variant: "gfortran-11-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_11}
