          - {variant: "gfortran-10-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_10}
          - {variant: "gfortran-9-array", compiler: "gcc", implementation: "Array", toolchain: &gfortran_9 {image: "docker.io/library/ubuntu:24.04", fc: "gfortran-9", packages: "gfortran-9"}}
          - {variant: "gfortran-9-openmp", compiler: "gcc", implementation: "OpenMP", toolchain: *gfortran_9}
