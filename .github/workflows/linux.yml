          ### GPU, compile only ###
          - {variant: "nvfortran-cuda", compiler: "nvhpc", implementation: "CUDA", make_args: "GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-cudakernel", compiler: "nvhpc", implementation: "CUDAKernel", make_args: "GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-doconcurrent-gpu", compiler: "nvhpc", implementation: "DoConcurrent", make_args: "TARGET=gpu GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-array-gpu", compiler: "nvhpc", implementation: "Array", make_args: "TARGET=gpu GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-openmptarget-gpu", compiler: "nvhpc", implementation: "OpenMPTarget", make_args: "TARGET=gpu GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-openmptargetloop-gpu", compiler: "nvhpc", implementation: "OpenMPTargetLoop", make_args: "TARGET=gpu GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-openacc-gpu", compiler: "nvhpc", implementation: "OpenACC", make_args: "TARGET=gpu GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "nvfortran-openaccarray-gpu", compiler: "nvhpc", implementation: "OpenACCArray", make_args: "TARGET=gpu GPU=cc80", skip_run: true, toolchain: *nvfortran}
          - {variant: "gfortran-15-openmptarget-nvptx", compiler: "gcc", implementation: "OpenMPTarget", make_args: "OFFLOAD=nvptx-none OFFLOAD_ARCH=sm_80", skip_run: true, toolchain: &gfortran_15_offload {architectures: [x86_64], image: "docker.io/library/ubuntu:26.04", fc: "gfortran-15", packages: "gfortran-15 gcc-15-offload-nvptx gcc-15-offload-amdgcn"}}
          - {variant: "gfortran-15-openmptargetloop-nvptx", compiler: "gcc", implementation: "OpenMPTargetLoop", make_args: "OFFLOAD=nvptx-none OFFLOAD_ARCH=sm_80", skip_run: true, toolchain: *gfortran_15_offload}
          - {variant: "gfortran-15-openacc-nvptx", compiler: "gcc", implementation: "OpenACC", make_args: "OFFLOAD=nvptx-none OFFLOAD_ARCH=sm_80", skip_run: true, toolchain: *gfortran_15_offload}
          - {variant: "gfortran-15-openaccarray-nvptx", compiler: "gcc", implementation: "OpenACCArray", make_args: "OFFLOAD=nvptx-none OFFLOAD_ARCH=sm_80", skip_run: true, toolchain: *gfortran_15_offload}
          - {variant: "gfortran-15-openmptarget-amdgcn", compiler: "gcc", implementation: "OpenMPTarget", make_args: "OFFLOAD=amdgcn-amdhsa OFFLOAD_ARCH=gfx90a", skip_run: true, toolchain: *gfortran_15_offload}
          - {variant: "gfortran-15-openmptargetloop-amdgcn", compiler: "gcc", implementation: "OpenMPTargetLoop", make_args: "OFFLOAD=amdgcn-amdhsa OFFLOAD_ARCH=gfx90a", skip_run: true, toolchain: *gfortran_15_offload}
          - {variant: "gfortran-15-openacc-amdgcn", compiler: "gcc", implementation: "OpenACC", make_args: "OFFLOAD=amdgcn-amdhsa OFFLOAD_ARCH=gfx90a", skip_run: true, toolchain: *gfortran_15_offload}
          - {variant: "gfortran-15-openaccarray-amdgcn", compiler: "gcc", implementation: "OpenACCArray", make_args: "OFFLOAD=amdgcn-amdhsa OFFLOAD_ARCH=gfx90a", skip_run: true, toolchain: *gfortran_15_offload}
    uses: ./.github/workflows/fortran.yml
    with:
      configuration: ${{ toJSON(matrix) }}

  rust:
    name: rust / ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, aarch64]
    defaults:
      run:
        working-directory: ./src/rust/rust-stream
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup project
        run: rustup update stable
      - name: Compile project
        run: cargo +stable build --release
      - name: Test project
        run: cargo +stable test --release
      - name: Test run project
        run: ./target/release/rust-stream --arraysize 2048
      - name: Test run project (float)
        run: ./target/release/rust-stream --arraysize 2048 --float

  java:
    name: java / ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, aarch64]
    defaults:
      run:
        working-directory: ./src/java/java-stream
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test build project
        run: ./mvnw clean package
      - name: Test run
        run: java -jar target/java-stream.jar --arraysize 2048

  scala:
    name: scala / ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, aarch64]
    defaults:
      run:
        working-directory: ./src/scala/scala-stream
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build project
        run: ./sbt -batch assembly
      - name: Test run
        run: java -jar target/scala-3.3.1/scala-stream.jar --arraysize 2048
      - name: Test run (float)
        run: java -jar target/scala-3.3.1/scala-stream.jar --arraysize 2048 --float
      - name: Test run (nstream)
        run: java -jar target/scala-3.3.1/scala-stream.jar --arraysize 2048 --nstream_only

  julia:
    name: julia / ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86_64, aarch64]
    defaults:
      run:
        working-directory: ./src/julia/JuliaStream.jl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Setup project
        run: julia --project -e 'import Pkg; Pkg.instantiate()'
      - name: Test run PlainStream.jl
        run: julia --project src/PlainStream.jl --arraysize 2048
      - name: Test run ThreadedStream.jl
        run: julia --threads 2 --project src/ThreadedStream.jl --arraysize 2048
      - name: Test run DistributedStream.jl (no flag)
        run: julia --project src/DistributedStream.jl --arraysize 2048
      - name: Test run DistributedStream.jl (-p 2)
        run: julia -p 2 --project src/DistributedStream.jl --arraysize 2048
      - name: Test run CUDAStream.jl
        run: julia --project src/CUDAStream.jl --list
      - name: Test run AMDGPUStream.jl
        run: julia --project src/AMDGPUStream.jl --list
