          - {variant: "flang-21-sequential", compiler: "flang", implementation: "Sequential", toolchain: &flang_21 {image: "docker.io/library/ubuntu:26.04", fc: "flang-21", packages: "flang-21 libomp-21-dev libclang-rt-21-dev"}}
          - {variant: "flang-21-array", compiler: "flang", implementation: "Array", toolchain: *flang_21}
          - {variant: "flang-21-doconcurrent", compiler: "flang", implementation: "DoConcurrent", toolchain: *flang_21}
          - {variant: "flang-21-openmp", compiler: "flang", implementation: "OpenMP", toolchain: *flang_21}
          - {variant: "flang-21-openmpworkshare", compiler: "flang", implementation: "OpenMPWorkshare", toolchain: *flang_21}
          - {variant: "flang-21-openmptarget", compiler: "flang", implementation: "OpenMPTarget", toolchain: *flang_21}
          - {variant: "flang-21-openmptargetloop", compiler: "flang", implementation: "OpenMPTargetLoop", toolchain: *flang_21}
          - {variant: "nvfortran-sequential", compiler: "nvhpc", implementation: "Sequential", make_args: "TARGET=multicore", toolchain: &nvfortran {image: "nvcr.io/nvidia/nvhpc:26.5-devel-cuda13.2-ubuntu24.04", fc: "nvfortran", cleanup_disk: true}}
          - {variant: "nvfortran-array", compiler: "nvhpc", implementation: "Array", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-doconcurrent", compiler: "nvhpc", implementation: "DoConcurrent", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-openmp", compiler: "nvhpc", implementation: "OpenMP", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-openmpworkshare", compiler: "nvhpc", implementation: "OpenMPWorkshare", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-openmptarget", compiler: "nvhpc", implementation: "OpenMPTarget", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-openmptargetloop", compiler: "nvhpc", implementation: "OpenMPTargetLoop", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-openacc", compiler: "nvhpc", implementation: "OpenACC", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "nvfortran-openaccarray", compiler: "nvhpc", implementation: "OpenACCArray", make_args: "TARGET=multicore", toolchain: *nvfortran}
          - {variant: "ifx-sequential", compiler: "oneapi", implementation: "Sequential", toolchain: &ifx {architectures: [x86_64], image: "docker.io/library/ubuntu:24.04", fc: "ifx", packages: "intel-oneapi-compiler-fortran-2025.3",
