          - {variant: "flang-22-array", compiler: "flang", implementation: "Array", toolchain: *flang_22}
          - {variant: "flang-22-doconcurrent", compiler: "flang", implementation: "DoConcurrent", toolchain: *flang_22}
          - {variant: "flang-22-openmpworkshare", compiler: "flang", implementation: "OpenMPWorkshare", toolchain: *flang_22}
