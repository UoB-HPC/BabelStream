name: Fortran

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string

permissions:
  contents: read

jobs:
  fortran:
    name: ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        architecture: ${{ fromJSON(inputs.configuration).toolchain.architectures || fromJSON('["x86_64", "aarch64"]') }}
        include: ${{ fromJSON(format('[{0}]', inputs.configuration)) }}

    env:
      CI_BUILD_DIR: build/ci/${{ matrix.variant }}-${{ matrix.architecture }}
      CI_COMPILER: ${{ matrix.compiler }}
      CI_IMPL: ${{ matrix.implementation }}
      CI_IMAGE: ${{ matrix.toolchain.image }}
      FC: ${{ matrix.toolchain.fc }}
      CI_PACKAGES: ${{ matrix.toolchain.packages }}
      CI_APT_KEY: ${{ matrix.toolchain.apt_key }}
      CI_APT_SOURCE: ${{ matrix.toolchain.apt_source }}
      CI_ENV_SCRIPT: ${{ matrix.toolchain.env_script }}
      CI_MAKE_ARGS: ${{ matrix.make_args }}
      CI_SKIP_RUN: ${{ matrix.skip_run && '1' || '' }}
      OMP_NUM_THREADS: "2"
      ACC_NUM_CORES: "2"
      NVIDIA_VISIBLE_DEVICES: void

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free disk for NVHPC image
        if: matrix.toolchain.cleanup_disk && !env.ACT
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /usr/local/share/powershell

      - name: Install container client if needed
        run: |
          if ! command -v docker >/dev/null 2>&1 && ! command -v podman >/dev/null 2>&1; then
            cli_dir="$RUNNER_TEMP/container-cli"
            mkdir -p "$cli_dir"
            as_root=()
            if command -v sudo >/dev/null 2>&1; then as_root=(sudo); fi
            "${as_root[@]}" apt-get -o Acquire::Retries=5 update
            (cd "$cli_dir" && apt-get -o Acquire::Retries=5 download docker.io)
            dpkg-deb --fsys-tarfile "$cli_dir"/docker.io_*.deb |
              tar -x -C "$cli_dir" --strip-components=3 ./usr/bin/docker
            echo "$cli_dir" >> "$GITHUB_PATH"
          fi

      - name: Build and run in toolchain container
        run: |
          engine=podman
          if command -v docker >/dev/null 2>&1; then engine=docker; fi
          container_options=()
          if [[ -n ${ACT:-} ]]; then
            container_options+=(--security-opt label=disable)
          fi
          "$engine" run --rm "${container_options[@]}" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --env DEBIAN_FRONTEND=noninteractive \
            --env FC --env CI_BUILD_DIR --env CI_COMPILER --env CI_IMPL \
            --env CI_PACKAGES --env CI_APT_KEY --env CI_APT_SOURCE --env CI_ENV_SCRIPT \
            --env CI_MAKE_ARGS --env CI_SKIP_RUN \
            --env OMP_NUM_THREADS --env ACC_NUM_CORES --env NVIDIA_VISIBLE_DEVICES \
            "$CI_IMAGE" bash -lc 'bash .github/ci/install.sh && bash .github/ci/fortran-build.sh'

      - name: Upload failure logs
        if: failure() && !env.ACT
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.variant }}-${{ matrix.architecture }}
          path: |
            build/ci/**/CMakeCache.txt
            build/ci/**/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/**/Testing/Temporary/**
            build/ci/**/tests/**
          if-no-files-found: ignore
